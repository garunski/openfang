                    <div class="of-card-header" style="margin:0" x-text="qs.name"></div>
                    <span class="runtime-badge runtime-badge-prompt">PROMPT</span>
                  </div>
                  <div class="of-card-meta" x-text="qs.description"></div>
                  <div class="flex justify-end mt-2">
                    <button type="button" class="button is-ghost is-small" @click="createDemoSkill(qs)" :disabled="isSkillInstalledByName(qs.name)">
                      <i class="fa fa-check" aria-hidden="true" x-show="isSkillInstalledByName(qs.name)"></i>
                      <i class="fa fa-plus" aria-hidden="true" x-show="!isSkillInstalledByName(qs.name)"></i>
                      <span x-text="isSkillInstalledByName(qs.name) ? 'Created' : 'Create skill'"></span>
                    </button>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Skill Detail Modal -->
          <template x-if="skillDetail || detailLoading">
            <div class="of-modal-overlay" @click.self="closeDetail()" @keydown.escape.window="closeDetail()">
              <div class="of-modal">
                <!-- Loading state -->
                <div x-show="detailLoading" class="loading-state" style="padding:40px 0"><div class="spinner"></div><span>Loading skill details...</span></div>
                <!-- Loaded content -->
                <template x-if="skillDetail">
                  <div>
                    <div class="of-modal-header">
                      <h3 x-text="skillDetail.name || skillDetail.slug"></h3>
                      <div class="of-modal-header__actions">
                        <button type="button" class="button is-ghost is-small" @click="closeDetail()">Cancel</button>
                        <button type="button" class="of-modal-close" @click="closeDetail()" aria-label="Close">&times;</button>
                      </div>
                    </div>
                    <div class="mb-3">
                      <div class="flex gap-2 items-center flex-wrap">
                        <span class="badge badge-info">ClawHub</span>
                        <span class="text-xs text-dim" x-show="skillDetail.version" x-text="'v' + skillDetail.version"></span>
                        <span class="text-xs" x-show="skillDetail.author_name || skillDetail.author" style="color:var(--text-dim)">
                          <span x-show="skillDetail.author_image" style="display:inline-block;vertical-align:middle;margin-right:4px"><img :src="skillDetail.author_image" style="width:16px;height:16px;border-radius:50%"></span>
                          <span x-text="'by ' + (skillDetail.author_name || skillDetail.author)"></span>
                        </span>
                      </div>
                    </div>
                    <div class="flex gap-4 items-center mb-3" x-show="skillDetail.downloads || skillDetail.stars">
                      <span class="text-sm" x-show="skillDetail.downloads" x-text="formatDownloads(skillDetail.downloads) + ' downloads'" style="color:var(--text-dim)"></span>
                      <span class="text-sm" x-show="skillDetail.stars" x-text="skillDetail.stars + ' stars'" style="color:var(--text-dim)"></span>

                  <p x-text="pertError"></p>
                  <button type="button" class="button is-ghost is-small" @click="retryLoad('pert')">Retry</button>
                </div>

                          </template>
                        </select>

                        <select class="form-input" x-model="pertFilterLabel" @change="rebuildPertLayout()">
                          <option value="">All labels</option>
                          <template x-for="lb in pertLabelOptions" :key="String(lb)">

                          </template>

                    <template x-if="(backlogDetailTask.acceptanceCriteriaItems || []).length && !taskDetailEditMode && taskModalTaskActions">

                      </section>
                    </template>
                    <template x-if="(backlogDetailTask.acceptanceCriteriaItems || []).length && !taskDetailEditMode && !taskModalTaskActions">

                        <ul class="text-sm text-dim pl-4 task-detail-modal__ac-readonly" style="list-style:disc">
                          <template x-for="(ac, idx) in backlogDetailTask.acceptanceCriteriaItems" :key="idx">
                            <li x-text="(ac.checked ? '\u2713 ' : '') + ac.text"></li>
                          </template>
                        </ul>
                      </section>
                    </template>
                    <template x-if="backlogDetailTask.implementationPlan && !taskDetailEditMode">
                      <section class="task-detail-modal__section">
                        <h4 class="task-detail-modal__section-title">Implementation plan</h4>
                        <div class="message-bubble markdown-body task-detail-modal__md of-modal-chrome-readonly-md" x-html="backlogDetailMd(backlogDetailTask.implementationPlan)"></div>
                      </section>
                    </template>
                    <template x-if="backlogDetailTask.implementationNotes && !taskDetailEditMode">
                      <section class="task-detail-modal__section">
                        <h4 class="task-detail-modal__section-title">Implementation notes</h4>
                        <div class="message-bubble markdown-body task-detail-modal__md of-modal-chrome-readonly-md" x-html="backlogDetailMd(backlogDetailTask.implementationNotes)"></div>
                      </section>
                    </template>
                    <template x-if="backlogDetailTask.finalSummary && !taskDetailEditMode">
                      <section class="task-detail-modal__section">
                        <h4 class="task-detail-modal__section-title">Final summary</h4>
                        <div class="message-bubble markdown-body task-detail-modal__md of-modal-chrome-readonly-md" x-html="backlogDetailMd(backlogDetailTask.finalSummary)"></div>
                      </section>
                    </template>
                  </div>
                  <aside class="task-detail-modal__sidebar">
                    <template x-if="!taskDetailEditMode">
                      <div class="task-detail-modal__meta">
                        <div class="task-detail-modal__meta-row">
                          <span class="task-detail-modal__meta-label">Created</span>
                          <span class="task-detail-modal__meta-value" x-text="backlogDetailTask.createdDate || backlogDetailTask.created_date || '—'"></span>
                        </div>
                        <div class="task-detail-modal__meta-row">
                          <span class="task-detail-modal__meta-label">Updated</span>
                          <span class="task-detail-modal__meta-value" x-text="backlogDetailTask.updatedDate || backlogDetailTask.updated_date || '—'"></span>
                        </div>
                        <div class="task-detail-modal__meta-block">
                          <span class="task-detail-modal__meta-label">Title</span>
                          <p class="task-detail-modal__sidebar-title" x-text="backlogDetailTask.title || '—'"></p>
                        </div>
                        <div class="task-detail-modal__meta-row">
                          <span class="task-detail-modal__meta-label">Status</span>
                          <span class="task-detail-modal__meta-value" x-text="backlogDetailTask.status || '—'"></span>
                        </div>
                        <div class="task-detail-modal__meta-row">
                          <span class="task-detail-modal__meta-label">Milestone</span>
                          <span class="task-detail-modal__meta-value" x-text="backlogDetailTask.milestone || '—'"></span>
                        </div>
                        <div class="task-detail-modal__meta-block">
                          <span class="task-detail-modal__meta-label">Assignee</span>
                          <p class="task-detail-modal__meta-value" x-text="taskJoin(backlogDetailTask.assignee)"></p>
                        </div>
                        <div class="task-detail-modal__meta-block">
                          <span class="task-detail-modal__meta-label">Labels</span>
                          <div class="flex flex-wrap gap-1 mt-1" x-show="(backlogDetailTask.labels || []).length">
                            <template x-for="(lb, li) in (backlogDetailTask.labels || [])" :key="li">
                              <span class="badge badge-info text-xs" x-text="lb"></span>
                            </template>
                          </div>
                          <p class="text-dim text-sm" x-show="!(backlogDetailTask.labels || []).length">—</p>
                        </div>
                        <div class="task-detail-modal__meta-row">
                          <span class="task-detail-modal__meta-label">Priority</span>
                          <span class="task-detail-modal__meta-value"><span class="badge" :class="priorityClass(backlogDetailTask.priority)" x-text="taskDetailPriorityDisplay()"></span></span>
                        </div>
                        <div class="task-detail-modal__meta-block">
                          <span class="task-detail-modal__meta-label">Dependencies</span>
                          <p class="task-detail-modal__meta-value text-xs font-mono" x-text="taskJoin(backlogDetailTask.dependencies)"></p>
                        </div>
                      </div>
                    </template>
                    <template x-if="taskDetailEditMode">
                      <div class="task-detail-modal__edit">
                        <div class="form-group" style="margin-bottom:12px">
                          <label>Title</label>
                          <textarea class="form-input" rows="2" x-model="taskEditForm.title" placeholder="Task title"></textarea>
                        </div>
                        <div class="form-group" style="margin-bottom:12px">
                          <label>Status</label>
                          <select class="form-input" x-model="taskEditForm.status">
                            <template x-for="st in taskEditStatusOptions()" :key="String(st)">
                              <option :value="st" x-text="st"></option>
                            </template>
                          </select>
                        </div>
                        <div class="form-group" style="margin-bottom:12px">
                          <label>Priority</label>
                          <select class="form-input" x-model="taskEditForm.priority">
                            <option value="">(none)</option>
                            <option value="high">high</option>
                            <option value="medium">medium</option>
                            <option value="low">low</option>
                          </select>
                        </div>
                        <div class="form-group" style="margin-bottom:12px" x-show="selectedProject">
                          <label>Milestone</label>
                          <select
                            class="form-input"
                            x-model="taskEditForm.milestoneId"
                            :key="'milestonesel-' + taskEditSessionKey"
                          >
                            <template x-for="(row, ri) in taskDetailMilestoneSelectRows()" :key="'tm-' + taskEditSessionKey + '-' + ri + '-' + (row.value || 'none')">
                              <option :value="row.value" x-text="row.text"></option>
                            </template>
                          </select>
                          <p class="text-xs text-dim mt-1" x-show="selectedProject && (!detailMilestones || !detailMilestones.length)">No active milestones. Add some under the Milestones tab.</p>

                        <div class="form-group" style="margin-bottom:12px">
                          <label>Assignees (one per line)</label>
                          <textarea class="form-input" rows="3" x-model="taskEditForm.assigneeText" placeholder="Type name and press Enter between lines"></textarea>
                        </div>
                        <div class="form-group" style="margin-bottom:0">

                          <input class="form-input" type="text" x-model="taskEditForm.labelsText">

                </div>
                </template>
