<body x-data="app" :data-theme="theme">

<!-- Auth Prompt (API Key or Username/Password) -->
<div x-show="$store.app.showAuthPrompt" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px)" x-data="{ apiKeyInput: '', loginUser: '', loginPass: '' }">
  <div style="background:var(--bg-card,#1e1e2e);border:1px solid var(--border,#333);border-radius:12px;padding:2rem;max-width:400px;width:90%">
    <!-- Session login mode -->
    <template x-if="$store.app.authMode === 'session'">
      <div>
        <h3 style="margin:0 0 0.5rem;font-size:1.1rem">Sign In</h3>
        <p style="color:var(--text-dim,#888);font-size:0.85rem;margin:0 0 1rem">Enter your dashboard credentials.</p>
        <input type="text" x-model="loginUser" placeholder="Username" autocomplete="username" style="width:100%;padding:0.6rem;border-radius:6px;border:1px solid var(--border,#333);background:var(--bg-input,#151520);color:var(--text,#e0e0e0);font-size:0.9rem;box-sizing:border-box;margin-bottom:0.5rem">
        <input type="password" x-model="loginPass" placeholder="Password" autocomplete="current-password" @keydown.enter="$store.app.sessionLogin(loginUser, loginPass)" style="width:100%;padding:0.6rem;border-radius:6px;border:1px solid var(--border,#333);background:var(--bg-input,#151520);color:var(--text,#e0e0e0);font-size:0.9rem;box-sizing:border-box;margin-bottom:0.75rem">
        <button @click="$store.app.sessionLogin(loginUser, loginPass)" style="width:100%;padding:0.6rem;border-radius:6px;border:none;background:var(--accent,#7c3aed);color:#fff;font-weight:600;cursor:pointer;font-size:0.9rem">Sign In</button>
      </div>
    </template>
    <!-- API key mode -->
    <template x-if="$store.app.authMode === 'apikey'">
      <div>
        <h3 style="margin:0 0 0.5rem;font-size:1.1rem">API Key Required</h3>
        <p style="color:var(--text-dim,#888);font-size:0.85rem;margin:0 0 0.5rem">This instance requires an API key. Enter the key from your <code>config.toml</code>.</p>
        <p style="color:var(--text-dim,#666);font-size:0.75rem;margin:0 0 1rem">Add <code style="color:var(--accent-light,#a78bfa);background:var(--bg,#111);padding:1px 4px;border-radius:2px">api_key = "your-key"</code> at the <strong>top</strong> of <code>~/.openfang/config.toml</code> (not under any [section]).</p>
        <input type="password" x-model="apiKeyInput" placeholder="Enter API key..." @keydown.enter="$store.app.submitApiKey(apiKeyInput)" style="width:100%;padding:0.6rem;border-radius:6px;border:1px solid var(--border,#333);background:var(--bg-input,#151520);color:var(--text,#e0e0e0);font-size:0.9rem;box-sizing:border-box;margin-bottom:0.75rem">
        <button @click="$store.app.submitApiKey(apiKeyInput)" style="width:100%;padding:0.6rem;border-radius:6px;border:none;background:var(--accent,#7c3aed);color:#fff;font-weight:600;cursor:pointer;font-size:0.9rem">Unlock Dashboard</button>
      </div>
    </template>
  </div>
</div>

<div class="app-layout" :class="{ 'focus-mode': $store.app.focusMode }">
  <!-- Sidebar -->
  <nav class="sidebar" :class="{ collapsed: sidebarCollapsed, 'mobile-open': mobileMenuOpen }">
    <div class="sidebar-header">
      <div class="sidebar-header-text">
        <div class="sidebar-logo">
          <span class="sidebar-logo__mark" aria-hidden="true">
            <img src="/logo.png" alt="" width="22" height="22">
          </span>
          <div class="sidebar-logo__text">
            <h1>OPENFANG</h1>
            <div class="version" x-text="'v' + version"></div>
          </div>
        </div>
      </div>
      <div class="theme-switcher" role="group" aria-label="Color theme">
        <button type="button" class="theme-opt" :class="{ active: themeMode === 'light' }" @click="setTheme('light')" title="Light" aria-label="Light theme"><i class="fa fa-sun-o" aria-hidden="true"></i></button>
        <button type="button" class="theme-opt" :class="{ active: themeMode === 'system' }" @click="setTheme('system')" title="System" aria-label="Match system theme"><i class="fa fa-adjust" aria-hidden="true"></i></button>
        <button type="button" class="theme-opt" :class="{ active: themeMode === 'dark' }" @click="setTheme('dark')" title="Dark" aria-label="Dark theme"><i class="fa fa-moon-o" aria-hidden="true"></i></button>
      </div>
    </div>

    <div class="sidebar-status" :class="{ offline: !connected && !$store.app.booting }">
      <span class="status-dot"></span>
      <span class="sidebar-label" x-show="connected" x-text="agentCount + ' agent(s) running'"></span>
      <span class="sidebar-label" x-show="$store.app.booting && !connected" class="conn-reconnecting">Connecting...</span>
      <span class="sidebar-label" x-show="!connected && !$store.app.booting && $store.app.connectionState === 'reconnecting'" class="conn-reconnecting">Reconnecting...</span>
      <span class="sidebar-label" x-show="!connected && !$store.app.booting && $store.app.connectionState !== 'reconnecting'" x-text="'disconnected' + ($store.app.lastError ? ' — ' + $store.app.lastError : '')">disconnected</span>
      <span class="conn-badge sidebar-label" :class="wsConnected ? 'ws' : 'http'" x-text="wsConnected ? 'WS' : 'HTTP'" x-show="connected"></span>
    </div>

    <div class="sidebar-nav" role="navigation" aria-label="Main navigation">
      <!-- Monitor -->
      <div class="nav-section" x-data="{ collapsed: false }" aria-label="Monitor">
        <div class="nav-section-title" @click="collapsed = !collapsed">
          <span class="nav-label">Monitor</span>
          <span class="nav-section-chevron" :style="collapsed ? '' : 'transform:rotate(90deg)'">&rsaquo;</span>
        </div>
        <template x-if="!collapsed">
          <div x-transition>
            <a class="nav-item" :class="{ active: page === 'overview' }" @click="navigate('overview')" :aria-current="page === 'overview' ? 'page' : false">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
              <span class="nav-label">Overview</span>
            </a>
            <a class="nav-item" :class="{ active: page === 'analytics' }" @click="navigate('analytics')" :aria-current="page === 'analytics' ? 'page' : false">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg></span>
              <span class="nav-label">Analytics</span>
            </a>
            <a class="nav-item" :class="{ active: page === 'logs' }" @click="navigate('logs')" :aria-current="page === 'logs' ? 'page' : false">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></svg></span>
              <span class="nav-label">Logs</span>
            </a>
          </div>
        </template>
      </div>

      <!-- Projects -->
      <div class="nav-section" x-data="{ collapsed: false }" aria-label="Projects">
        <div class="nav-section-title" @click="collapsed = !collapsed">
          <span class="nav-label">Projects</span>
          <span class="nav-section-chevron" :style="collapsed ? '' : 'transform:rotate(90deg)'">&rsaquo;</span>
        </div>
        <template x-if="!collapsed">
          <div x-transition>
            <a class="nav-item" :class="{ active: page === 'projects' && !projectRouteId }" @click="navigate('projects')" :aria-current="page === 'projects' && !projectRouteId ? 'page' : false">
              <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
              <span class="nav-label">All projects</span>
            </a>
            <template x-for="p in sidebarProjects" :key="p.id">
              <a class="nav-item nav-item-nested" :class="{ active: page === 'projects' && String(projectRouteId) === String(p.id) }" @click="navigate('projects/' + encodeURIComponent(p.id) + '/overview')" :title="p.path || ''">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg></span>
                <span class="nav-label truncate" x-text="p.name || p.id"></span>
              </a>
            </template>
          </div>
        </template>
      </div>

      <!-- System -->
      <div class="nav-section" x-data="{ collapsed: false }" aria-label="System">
        <div class="nav-section-title" @click="collapsed = !collapsed">
          <span class="nav-label">System</span>
          <span class="nav-section-chevron" :style="collapsed ? '' : 'transform:rotate(90deg)'">&rsaquo;</span>
        </div>
        <template x-if="!collapsed">
          <div x-transition>
            <a class="nav-item" :class="{ active: page === 'agents' }" @click="navigate('agents/sessions')" :aria-current="page === 'agents' ? 'page' : false">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
              <span class="nav-label">Agents</span>
              <span class="badge badge-warn" x-show="$store.app.pendingApprovalCount > 0" x-text="$store.app.pendingApprovalCount"></span>
            </a>
            <a class="nav-item" :class="{ active: page === 'scheduler' }" @click="navigate('scheduler')" :aria-current="page === 'scheduler' ? 'page' : false">
              <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
              <span class="nav-label">Scheduler</span>
            </a>
            <a class="nav-item" :class="{ active: page === 'channels' }" @click="navigate('channels')" :aria-current="page === 'channels' ? 'page' : false">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3l-2 18M16 3l-2 18"/></svg></span>
              <span class="nav-label">Channels</span>
            </a>
            <a class="nav-item" :class="{ active: page === 'skills' }" @click="navigate('skills')" :aria-current="page === 'skills' ? 'page' : false">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg></span>
              <span class="nav-label">Skills</span>
            </a>
            <a class="nav-item" :class="{ active: page === 'hands' }" @click="navigate('hands')" :aria-current="page === 'hands' ? 'page' : false">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v6"/><path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.7-2.4L3.4 16a2 2 0 0 1 3.2-2.4L8 15"/></svg></span>
              <span class="nav-label">Hands</span>
            </a>
            <a class="nav-item" :class="{ active: page === 'runtime' }" @click="navigate('runtime')" :aria-current="page === 'runtime' ? 'page' : false">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
              <span class="nav-label">Runtime</span>
            </a>
            <a class="nav-item" :class="{ active: page === 'settings' }" @click="navigate('settings')" :aria-current="page === 'settings' ? 'page' : false">
              <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg></span>
              <span class="nav-label">Settings</span>
            </a>
          </div>
        </template>
      </div>
    </div>

    <div class="sidebar-footer">
      <div x-show="$store.app.sessionUser" style="padding:4px 16px;display:flex;align-items:center;justify-content:space-between">
        <span class="text-xs text-dim" x-text="$store.app.sessionUser" style="letter-spacing:0.5px"></span>
        <button @click="$store.app.sessionLogout()" class="button is-ghost is-small" style="font-size:11px;padding:2px 8px;opacity:0.7" title="Sign out">Logout</button>
      </div>
      <div class="sidebar-label text-xs text-dim" style="padding:0 16px 4px;letter-spacing:0.5px">Ctrl+K sessions | Ctrl+N chat</div>
    </div>
    <div class="sidebar-toggle" @click="toggleSidebar()" x-text="sidebarCollapsed ? '\u276F' : '\u276E'"></div>
  </nav>

  <div class="sidebar-overlay" @click="mobileMenuOpen = false"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Mobile menu button -->
    <button type="button" class="mobile-menu-btn button is-ghost" @click="mobileMenuOpen = !mobileMenuOpen" aria-label="Open menu">
      <i class="fa fa-bars" aria-hidden="true"></i>
    </button>

    <!-- Agents hub: shared header + tabs (content panels are separate templates below) -->
    <template x-if="page === 'agents' && agentsHubTab !== 'chat'">
      <div class="agents-hub-chrome">
        <div class="page-header flex justify-between items-center flex-wrap gap-2">
          <h2>Agents</h2>
          <button type="button" class="button is-ghost is-small" @click="setAgentsHubTab('chat')">Open chat</button>
        </div>
        <div class="of-tabs">
          <div class="of-tab" :class="{ active: agentsHubTab === 'sessions' }" @click="setAgentsHubTab('sessions')">Sessions</div>
          <div class="of-tab" :class="{ active: agentsHubTab === 'approvals' }" @click="setAgentsHubTab('approvals')">
            Approvals
            <span class="badge badge-warn" style="margin-left:6px" x-show="$store.app.pendingApprovalCount > 0" x-text="$store.app.pendingApprovalCount"></span>
          </div>
          <div class="of-tab" :class="{ active: agentsHubTab === 'comms' }" @click="setAgentsHubTab('comms')">Comms</div>
        </div>
      </div>
    </template>

    <!-- Page: Overview -->
    <template x-if="page === 'overview'">
      <div x-data="overviewPage" x-init="loadOverview().then(() => startAutoRefresh())" @page-leave.window="stopAutoRefresh()">
        <div class="page-header">
          <h2>Overview</h2>
          <div class="flex items-center gap-2">
            <span class="health-indicator" :class="health.status === 'ok' ? 'health-ok' : 'health-down'" x-text="health.status === 'ok' ? 'Healthy' : 'Unreachable'"></span>
            <button type="button" class="button is-ghost is-small" @click="silentRefresh()" title="Refresh" style="padding:4px 8px" aria-label="Refresh">
              <i class="fa fa-refresh" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="page-body">
          <!-- Loading skeleton state -->
          <div x-show="loading" style="animation:fadeIn 0.2s">
            <div class="box mb-4">
              <div class="skeleton skeleton-text" style="width:120px;height:20px;margin-bottom:16px"></div>
              <div class="skeleton skeleton-text" style="width:100%;height:14px;margin-bottom:8px"></div>
              <div class="skeleton skeleton-text" style="width:85%;height:14px;margin-bottom:8px"></div>
              <div class="skeleton skeleton-text" style="width:70%;height:14px"></div>
            </div>
            <div class="overview-grid"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div>
          </div>
          <!-- Error state -->
          <div x-show="!loading && loadError" class="error-state" style="animation:fadeIn 0.3s">
            <div class="empty-state-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            </div>
            <h3 style="color:var(--error)">Connection Error</h3>
            <p class="text-xs text-dim" x-text="loadError"></p>
            <button class="button is-primary is-small" @click="loadData()" style="margin-top:8px">Retry</button>
          </div>
          <div x-show="!loading && !loadError" style="animation:fadeIn 0.3s">

          <!-- Registered projects -->
          <section class="box mb-4 overview-projects-box">
            <div class="level is-mobile is-align-items-flex-start mb-4">
              <div class="level-left">
                <div class="level-item">
                  <h3 class="title is-6 mb-0" style="display:flex;align-items:center;gap:8px;font-weight:600">
                    <i class="fa fa-folder-open" style="color:var(--accent)" aria-hidden="true"></i>
                    <span>Projects</span>
                  </h3>
                </div>
              </div>
              <div class="level-right">
                <div class="level-item">
                  <div class="buttons">
                    <button type="button" class="button is-primary is-small" @click="navigate('projects')"><i class="fa fa-plus" aria-hidden="true"></i><span>Register</span></button>
                    <button type="button" class="button is-light is-small" @click="loadProjects()" :disabled="projectsLoading"><i class="fa fa-refresh" aria-hidden="true"></i><span>Refresh</span></button>
                  </div>
                </div>
              </div>
            </div>
            <div x-show="projectsLoading" class="text-xs text-dim py-2">Loading projects…</div>
            <div x-show="!projectsLoading && !projects.length" class="content is-small">
              <p class="mb-2">No projects registered.</p>
              <button type="button" class="button is-ghost is-small" @click="navigate('projects')">Open Projects page</button>
            </div>
            <div x-show="!projectsLoading && projects.length">
              <template x-for="p in projects" :key="p.id">
                <div class="columns is-vcentered is-mobile is-multiline overview-project-row py-4" style="border-bottom:1px solid var(--border-subtle)">
                  <div class="column is-12-mobile is-6-tablet">
                    <p class="title is-6 mb-1" style="font-weight:600" x-text="p.name"></p>
                    <p class="is-size-7 text-dim font-mono truncate" style="margin:0" :title="p.path" x-text="truncatePath(p.path, 96)"></p>
                  </div>
                  <div class="column is-12-mobile is-6-tablet">
                    <div class="is-flex is-flex-wrap is-align-items-center is-justify-content-flex-end" style="gap:8px">
                      <span class="tag is-light is-rounded" x-text="'Spokes ' + (p.spoke_count != null ? p.spoke_count : 0)"></span>
                      <div class="buttons are-small mb-0">
                        <button type="button" class="button is-primary" @click="navigate('projects/' + encodeURIComponent(p.id) + '/overview')"><i class="fa fa-folder-open" aria-hidden="true"></i><span>Open</span></button>
                        <button type="button" class="button is-light" @click="navigate('projects/' + encodeURIComponent(p.id) + '/backlog')"><i class="fa fa-list" aria-hidden="true"></i><span>List</span></button>
                        <button type="button" class="button is-light" @click="navigate('projects/' + encodeURIComponent(p.id) + '/board')"><i class="fa fa-th" aria-hidden="true"></i><span>Board</span></button>
                        <button type="button" class="button is-danger is-light is-small" @click="deleteProject(p)" title="Remove from OpenFang" aria-label="Remove from OpenFang"><i class="fa fa-trash-o" aria-hidden="true"></i><span>Remove</span></button>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </section>

          <div class="overview-grid">
            <!-- System Health -->
            <div class="of-card">
              <div class="of-card-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;margin-right:4px;vertical-align:-2px"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                System Health
              </div>
              <div class="detail-grid" style="margin-top:8px">
                <div class="detail-row"><span class="detail-label">Status</span><span class="badge" :class="health.status === 'ok' ? 'badge-running' : 'badge-crashed'" x-text="health.status || 'unknown'"></span></div>
                <div class="detail-row"><span class="detail-label">Version</span><span class="detail-value font-mono" x-text="status.version || '-'"></span></div>
                <div class="detail-row"><span class="detail-label">Provider</span><span class="detail-value" x-text="status.default_provider || '-'"></span></div>
                <div class="detail-row"><span class="detail-label">Model</span><span class="detail-value font-mono" style="font-size:11px" x-text="status.default_model || '-'"></span></div>
              </div>
            </div>

            <!-- Security Systems -->
            <div class="of-card">
              <div class="of-card-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;margin-right:4px;vertical-align:-2px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Security Systems
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px">
                <span class="badge badge-success" style="font-size:9px;padding:2px 8px">Merkle Audit</span>
                <span class="badge badge-success" style="font-size:9px;padding:2px 8px">Taint Tracking</span>
                <span class="badge badge-success" style="font-size:9px;padding:2px 8px">WASM Sandbox</span>
                <span class="badge badge-success" style="font-size:9px;padding:2px 8px">GCRA Rate Limit</span>
                <span class="badge badge-success" style="font-size:9px;padding:2px 8px">Ed25519 Signing</span>
                <span class="badge badge-success" style="font-size:9px;padding:2px 8px">SSRF Protection</span>
                <span class="badge badge-success" style="font-size:9px;padding:2px 8px">Secret Zeroize</span>
                <span class="badge badge-success" style="font-size:9px;padding:2px 8px">Loop Guard</span>
                <span class="badge badge-success" style="font-size:9px;padding:2px 8px">Session Repair</span>
              </div>
              <div class="text-xs text-dim" style="margin-top:8px">9 defense-in-depth systems active</div>
            </div>

            <!-- Connected Channels -->
            <div class="of-card" x-show="channels.length">
              <div class="of-card-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;margin-right:4px;vertical-align:-2px"><path d="M4 9h16M4 15h16M10 3l-2 18M16 3l-2 18"/></svg>
                Connected Channels
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px">
                <template x-for="ch in channels" :key="ch.name">
                  <span class="badge badge-info" style="font-size:9px;text-transform:capitalize;padding:2px 8px" x-text="ch.name"></span>
                </template>
              </div>
              <div class="text-xs text-dim" style="margin-top:8px" x-text="channels.length + ' channel(s) connected'"></div>
            </div>

            <!-- MCP Servers -->
            <div class="of-card" x-show="mcpServers.length">
              <div class="of-card-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;margin-right:4px;vertical-align:-2px"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><path d="M6 6h.01M6 18h.01"/></svg>

              <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px">

                  </div>
                </template>
              </div>
            </div>
          </div>

          </div>
        </div>
      </div>
    </template>

    <!-- Page: Agents (chat / spawn only) -->
    <template x-if="page === 'agents' && agentsHubTab === 'chat'">
      <div x-data="agentsPage" @close-chat.window="closeChat()">

        <!-- MODE 1: Inline Chat (agent selected) -->
        <template x-if="activeChatAgent">
          <div x-data="chatPage" class="chat-wrapper">
            <!-- Chat header with back button -->
            <div class="page-header" x-show="currentAgent">
              <div class="flex items-center gap-2" style="min-width:0">
                <button type="button" class="button is-ghost is-small" @click="$dispatch('close-chat')" title="Back to Agents" style="padding:4px 8px;margin-right:4px" aria-label="Back to agents">
                  <i class="fa fa-arrow-left" aria-hidden="true"></i>
                </button>
                <span x-show="currentAgent && currentAgent.identity && currentAgent.identity.emoji" x-text="currentAgent && currentAgent.identity && currentAgent.identity.emoji" style="font-size:20px;line-height:1"></span>
                <div style="min-width:0">
                  <div class="font-bold" x-text="currentAgent ? currentAgent.name : ''"></div>
                  <div class="text-xs text-dim truncate" style="font-family:var(--font-mono);font-size:11px" x-text="currentAgent ? currentAgent.model_provider + ':' + currentAgent.model_name : ''"></div>
                </div>
              </div>
              <div class="flex gap-2 items-center">
                <span class="badge badge-running" x-show="currentAgent && !sending" style="animation:fadeIn 0.2s">
                  <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--success);margin-right:2px"></span> Ready
                </span>
                <span class="badge badge-suspended" x-show="sending" style="animation:fadeIn 0.2s">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>

                </span>
                <span class="queue-badge" x-show="messageQueue.length > 0" x-text="'+' + messageQueue.length + ' queued'"></span>
                <!-- Session switcher -->
                <div style="position:relative">
                  <button type="button" class="button is-ghost is-small" @click="sessionsOpen = !sessionsOpen" title="Sessions" style="position:relative" aria-label="Sessions">
                    <i class="fa fa-desktop" aria-hidden="true"></i>
                    <span class="session-count-badge" x-show="sessions.length > 1" x-text="sessions.length"></span>
                  </button>
                  <div class="session-dropdown" x-show="sessionsOpen" @click.outside="sessionsOpen = false" x-transition>
                    <div class="session-dropdown-header">
                      <span class="text-xs font-bold">Sessions</span>
                      <button class="button is-ghost is-small" @click="createSession()" style="padding:2px 6px;font-size:11px">+ New</button>
                    </div>
                    <template x-for="s in sessions" :key="s.session_id">
                      <div class="session-item" :class="{ active: s.active }" @click="if (!s.active) { switchSession(s.session_id); sessionsOpen = false; }">

                        <div style="flex:1;min-width:0">
                          <div class="text-xs font-bold truncate" x-text="s.label || 'Session ' + s.session_id.substring(0, 8)"></div>
                          <div class="text-xs text-dim" x-text="s.message_count + ' messages'"></div>
                        </div>
                      </div>
                    </template>
                    <div class="text-xs text-dim" style="padding:8px 12px;text-align:center" x-show="!sessions.length">No sessions</div>
                  </div>
                </div>
                <button type="button" class="button is-ghost is-small" @click="toggleSearch()" title="Search messages (Ctrl+F)" aria-label="Search messages">
                  <i class="fa fa-search" aria-hidden="true"></i>
                </button>
                <button type="button" class="button is-ghost is-small" @click="$store.app.toggleFocusMode()" title="Ctrl+Shift+F" aria-label="Toggle focus mode">
                  <i class="fa fa-expand" aria-hidden="true" x-show="!$store.app.focusMode"></i>
                  <i class="fa fa-compress" aria-hidden="true" x-show="$store.app.focusMode"></i>
                </button>
                <button type="button" class="button is-danger is-light is-small" @click="killAgent()"><i class="fa fa-stop" aria-hidden="true"></i><span>Stop</span></button>
              </div>
            </div>

            <!-- Search bar -->
            <div class="chat-search-bar" x-show="searchOpen" x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 transform -translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0">
              <i class="fa fa-search chat-search-bar-icon" aria-hidden="true"></i>
              <input type="text" id="chat-search-input" x-model="searchQuery" x-ref="searchInput" placeholder="Search messages..." class="chat-search-input" @keydown.escape="toggleSearch()">
              <span class="text-xs text-dim" x-show="searchQuery.trim()" x-text="filteredMessages.length + ' of ' + messages.length"></span>
              <button class="button is-ghost is-small" @click="toggleSearch()" style="padding:2px 6px">&times;</button>
            </div>

            <!-- Messages area -->
            <div class="messages" id="messages" @dragover.prevent="dragOver = true" @dragleave="dragOver = false" @drop.prevent="handleDrop($event); dragOver = false">
              <!-- Empty state: no agent selected -->
              <template x-if="!currentAgent">
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:32px;opacity:0.8">
                  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px;opacity:0.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  <h3 style="margin:0 0 8px;font-size:16px;font-weight:600">Select an agent to start chatting</h3>
                  <p class="text-dim" style="font-size:13px;max-width:320px">Choose an agent from the sidebar or go to the Agents tab to create a new one.</p>
                </div>
              </template>
              <!-- Message list -->
              <template x-if="currentAgent">
                <div>
                  <template x-for="(msg, $index) in filteredMessages" :key="msg.id">
                    <div class="message" :class="msg.role + (msg.thinking ? ' thinking' : '') + (msg.streaming ? ' streaming' : '') + (isGrouped($index) ? ' grouped' : '')">
                      <div class="message-avatar" x-show="msg.role === 'agent'">
                        <img src="/logo.png" alt="OpenFang">
                      </div>
                      <div class="message-body">
                        <!-- Copy button on hover -->
                        <div class="message-actions" x-show="msg.text && msg.text.trim() && !msg.thinking && !msg.streaming">
                          <button type="button" class="message-action-btn" :class="{ copied: msg._copied }" @click="copyMessage(msg)" :title="msg._copied ? 'Copied!' : 'Copy message'" :aria-label="msg._copied ? 'Copied' : 'Copy message'">
                            <i class="fa fa-copy" aria-hidden="true" x-show="!msg._copied"></i>
                            <i class="fa fa-check" aria-hidden="true" x-show="msg._copied"></i>
                          </button>
                        </div>
                        <!-- Thinking indicator with animated dots -->
                        <div class="message-bubble" x-show="msg.thinking" style="background:transparent;border:none;padding:4px 0">
                          <div class="typing-dots"><span></span><span></span><span></span></div>
                        </div>
                        <!-- Normal message content -->
                        <div class="message-bubble" :class="{ 'markdown-body': (msg.role === 'agent' || msg.role === 'system') && !msg.thinking && !msg.isHtml }" x-show="msg.text && msg.text.trim() && !msg.thinking" x-html="highlightSearch(msg.isHtml ? msg.text : ((msg.role === 'agent' || msg.role === 'system') && !msg.thinking ? renderMarkdown(msg.text) : escapeHtml(msg.text)))"></div>
                        <!-- Inline images from uploads (shown above tool cards) -->
                        <template x-if="msg.images && msg.images.length">
                          <div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0">
                            <template x-for="img in msg.images" :key="img.file_id">
                              <a :href="'/api/uploads/' + img.file_id" target="_blank" style="display:block">
                                <img :src="'/api/uploads/' + img.file_id" :alt="img.filename || 'uploaded image'" style="max-width:320px;max-height:320px;border-radius:8px;border:1px solid var(--border);cursor:pointer" loading="lazy">
                              </a>
                            </template>
                          </div>
                        </template>
                        <template x-for="tool in (msg.tools || [])" :key="tool.id">
                          <div class="tool-card" :class="{ 'tool-card-error': tool.is_error }" :data-tool="tool.name">
                            <div class="tool-card-header" @click="tool.expanded = !tool.expanded">
                              <template x-if="tool.running"><div class="tool-card-spinner"></div></template>
                              <template x-if="!tool.running && !tool.is_error"><span class="tool-icon-ok">&#10003;</span></template>
                              <template x-if="!tool.running && tool.is_error"><span class="tool-icon-err">&#10007;</span></template>
                              <span class="tool-card-icon" x-html="toolIcon(tool.name)"></span>
                              <span class="tool-card-name" x-text="tool.name"></span>
                              <span class="text-xs text-dim" x-text="tool.running ? 'running...' : (tool.is_error ? 'error' : (tool.result ? (tool.result.length > 500 ? Math.round(tool.result.length/1024) + 'KB' : 'done') : 'done'))" style="margin-left:auto"></span>
                              <span class="tool-expand-chevron" :style="tool.expanded ? 'transform:rotate(90deg)' : ''" style="transition:transform 0.15s">&#9654;</span>
                            </div>
                            <!-- Render generated images above the raw result -->
                            <div x-show="tool._imageUrls && tool._imageUrls.length" style="padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px">
                              <template x-for="iurl in (tool._imageUrls || [])" :key="iurl">
                                <a :href="iurl" target="_blank" style="display:block">
                                  <img :src="iurl" alt="Generated image" style="max-width:320px;max-height:320px;border-radius:8px;border:1px solid var(--border);cursor:pointer" loading="lazy">
                                </a>
                              </template>
                            </div>
                            <!-- Audio player for TTS results -->
                            <div x-show="tool._audioFile" style="padding:8px 12px">
                              <div class="audio-player">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                                <span class="text-xs" x-text="'Audio: ' + tool._audioFile.split('/').pop()"></span>
                                <span class="text-xs text-dim" x-show="tool._audioDuration" x-text="'~' + Math.round((tool._audioDuration || 0) / 1000) + 's'"></span>
                              </div>
                            </div>
                            <div class="tool-card-body" x-show="tool.expanded" x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
                              <div x-show="tool.input" style="margin-bottom:6px">
                                <div class="tool-section-label">Input</div>
                                <pre class="tool-pre" x-text="formatToolJson(tool.input)"></pre>
                              </div>
                              <div x-show="tool.result">
                                <div class="tool-section-label">Result <span class="text-xs text-muted" x-show="tool.result && tool.result.length > 200" x-text="'(' + tool.result.length + ' chars)'"></span></div>
                                <pre class="tool-pre" :class="{ 'tool-pre-error': tool.is_error, 'tool-pre-short': !tool.is_error && tool.result && tool.result.length < 100, 'tool-pre-medium': !tool.is_error && tool.result && tool.result.length >= 100 && tool.result.length < 500 }" x-text="formatToolJson(tool.result)"></pre>
                              </div>
                            </div>
                          </div>
                        </template>
                        <!-- Timestamp + meta row -->
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                          <div class="message-time" x-text="formatTime(msg.ts)" x-show="msg.ts && !msg.thinking"></div>
                          <div class="message-meta" x-text="msg.meta" x-show="msg.meta"></div>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Drop zone overlay -->
              <div x-show="dragOver" style="position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--surface);opacity:0.92;border:2px dashed var(--accent);border-radius:8px;pointer-events:none">
                <span style="font-size:16px;color:var(--accent);font-weight:600">Drop files here</span>
              </div>
            </div>

            <!-- Input area -->
            <div class="input-area" x-show="currentAgent" style="position:relative">
              <!-- Attachment previews -->
              <div x-show="attachments.length > 0" style="display:flex;gap:8px;flex-wrap:wrap;padding:0 0 8px 0">
                <template x-for="(att, aidx) in attachments" :key="aidx">
                  <div style="position:relative;border:1px solid var(--border);border-radius:6px;padding:4px;display:flex;align-items:center;gap:6px;background:var(--surface2);max-width:180px">
                    <img x-show="att.preview" :src="att.preview" style="width:32px;height:32px;object-fit:cover;border-radius:4px">
                    <span x-show="!att.preview" style="font-size:18px;width:32px;text-align:center">&#128196;</span>
                    <span class="text-xs truncate" style="max-width:100px" x-text="att.file.name"></span>
                    <span x-show="att.uploading" class="spinner" style="width:12px;height:12px;border-width:2px"></span>
                    <button @click="removeAttachment(aidx)" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;line-height:1">&times;</button>
                  </div>
                </template>
              </div>
              <!-- Slash command menu -->
              <div x-show="showSlashMenu && filteredSlashCommands.length" class="slash-menu">
                <template x-for="(cmd, idx) in filteredSlashCommands" :key="cmd.cmd">
                  <div class="slash-menu-item" :class="{ 'slash-active': idx === slashIdx }" @click="executeSlashCommand(cmd.cmd)" @mouseenter="slashIdx = idx">
                    <span class="font-bold" style="font-size:13px" x-text="cmd.cmd"></span>
                    <span class="text-xs text-dim" x-text="cmd.desc"></span>
                  </div>
                </template>
              </div>
              <!-- Model autocomplete picker -->
              <div x-show="showModelPicker && filteredModelPicker.length" class="slash-menu" style="max-height:280px;overflow-y:auto">
                <div class="text-xs text-dim" style="padding:4px 10px;border-bottom:1px solid var(--border)">Available models — pick one or keep typing</div>
                <template x-for="(m, idx) in filteredModelPicker" :key="m.id">
                  <div class="slash-menu-item" :class="{ 'slash-active': idx === modelPickerIdx }" @click="pickModel(m.id)" @mouseenter="modelPickerIdx = idx">
                    <span class="font-bold" style="font-size:12px;font-family:var(--font-mono)" x-text="m.id"></span>
                    <span class="text-xs text-dim" x-text="m.provider + (m.display_name && m.display_name !== m.id ? ' · ' + m.display_name : '')"></span>
                  </div>
                </template>
              </div>
              <!-- Input row -->
              <div class="input-row">
                <button type="button" class="button is-ghost is-small" @click="$refs.fileInput.click()" title="Attach file" style="padding:6px 8px;flex-shrink:0" aria-label="Attach file">
                  <i class="fa fa-paperclip" aria-hidden="true"></i>
                </button>
                <input type="file" x-ref="fileInput" multiple accept="image/*,.txt,.pdf,.md,.json,.csv,.mp3,.wav,.ogg,.webm,.m4a,.flac" @change="addFiles($event.target.files); $event.target.value = ''" style="display:none">
                <!-- Mic button -->
                <button type="button" class="button is-ghost is-small" :class="{ 'of-voice-recording': recording }" @mousedown="startRecording()" @mouseup="stopRecording()" @mouseleave="if(recording) stopRecording()" title="Hold to record voice" style="padding:6px 8px;flex-shrink:0" aria-label="Record voice">
                  <i class="fa fa-microphone" aria-hidden="true" x-show="!recording"></i>
                  <span x-show="recording" class="recording-dot"></span>
                </button>
                <!-- Recording indicator -->
                <div class="recording-indicator" x-show="recording" x-transition>
                  <span class="recording-dot"></span>
                  <span class="text-xs" style="color:var(--danger)" x-text="formatRecordingTime()"></span>
                </div>
                <textarea id="msg-input" rows="1" :placeholder="recording ? 'Recording... release to send' : 'Message OpenFang... (/ for commands)'"
                          @keydown.enter.prevent="if(!$event.isComposing && $event.keyCode !== 229 && !$event.shiftKey){if(showModelPicker && filteredModelPicker.length){pickModel(filteredModelPicker[modelPickerIdx].id)}else if(showSlashMenu && filteredSlashCommands.length){executeSlashCommand(filteredSlashCommands[slashIdx].cmd)}else{sendMessage()}}"
                          @keydown.escape="showSlashMenu = false; showModelPicker = false"
                          @keydown.arrow-up.prevent="if(showModelPicker){modelPickerIdx = Math.max(0, modelPickerIdx - 1)}else if(showSlashMenu){slashIdx = Math.max(0, slashIdx - 1)}"
                          @keydown.arrow-down.prevent="if(showModelPicker){modelPickerIdx = Math.min(filteredModelPicker.length - 1, modelPickerIdx + 1)}else if(showSlashMenu){slashIdx = Math.min(filteredSlashCommands.length - 1, slashIdx + 1)}"
                          @input="$el.style.height='auto';$el.style.height=Math.min($el.scrollHeight,150)+'px'"
                          x-model="inputText"
                          :class="{ 'streaming-active': sending }"></textarea>
                <!-- Send button (normal) or Stop button (during streaming) -->
                <template x-if="!sending">
                  <button type="button" class="of-chat-send" @click="sendMessage()" :disabled="!inputText.trim() && !attachments.length" aria-label="Send message">
                    <i class="fa fa-send" aria-hidden="true"></i>
                  </button>
                </template>
                <template x-if="sending">
                  <button type="button" class="of-chat-stop" @click="stopAgent()" title="Stop generating" aria-label="Stop generating">
                    <i class="fa fa-stop" aria-hidden="true"></i>
                  </button>
                </template>
              </div>
              <!-- Footer: model switcher + tokens + queue + tips -->
              <div class="input-footer">
                <div class="flex items-center gap-2">
                  <!-- Model Switcher -->
                  <div style="position:relative" x-show="currentAgent" @click.outside="showModelSwitcher = false" @keydown.escape.window="showModelSwitcher = false">
                    <button type="button" class="model-switcher-btn" @click="toggleModelSwitcher()" :disabled="sending" title="Switch model (Ctrl+M)" aria-label="Switch model">
                      <i class="fa fa-cube" aria-hidden="true"></i>
                      <span class="model-switcher-label" x-text="modelDisplayName || 'Model'"></span>
                      <i class="fa fa-chevron-down model-switcher-chevron" :class="{'open': showModelSwitcher}" aria-hidden="true"></i>
                    </button>
                    <!-- Dropdown -->
                    <div class="model-switcher-dropdown" x-show="showModelSwitcher" x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 transform translate-y-1" x-transition:enter-end="opacity-100 transform translate-y-0" x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
                      <div class="model-switcher-search">
                        <i class="fa fa-search model-switcher-search-icon" aria-hidden="true"></i>
                        <input id="model-switcher-search" type="text" x-model="modelSwitcherFilter" placeholder="Search models..." @keydown.escape.stop="showModelSwitcher = false" @keydown.arrow-down.prevent="modelSwitcherIdx = Math.min(modelSwitcherIdx + 1, filteredSwitcherModels.length - 1)" @keydown.arrow-up.prevent="modelSwitcherIdx = Math.max(modelSwitcherIdx - 1, 0)" @keydown.enter.prevent="!$event.isComposing && $event.keyCode !== 229 && filteredSwitcherModels[modelSwitcherIdx] && switchModel(filteredSwitcherModels[modelSwitcherIdx])">
                        <select x-model="modelSwitcherProviderFilter" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);font-size:11px;padding:2px 6px;cursor:pointer;font-family:var(--font-mono);flex-shrink:0">
                          <option value="">All</option>
                          <template x-for="pn in switcherProviders" :key="pn">
                            <option :value="pn" x-text="pn"></option>
                          </template>
                        </select>
                      </div>
                      <div x-show="modelSwitching" style="display:flex;align-items:center;justify-content:center;padding:12px;gap:8px">
                        <div class="tool-card-spinner"></div>
                        <span class="text-xs text-dim">Switching...</span>
                      </div>
                      <div class="model-switcher-list" x-show="!modelSwitching">
                        <template x-if="groupedSwitcherModels.length === 0">
                          <div style="padding:16px;text-align:center" class="text-xs text-dim">No models found</div>
                        </template>
                        <template x-for="group in groupedSwitcherModels" :key="group.provider">
                          <div>
                            <div class="model-switcher-group-header" x-text="group.provider"></div>
                            <template x-for="(m, mi) in group.models" :key="m.id">
                              <div class="model-switcher-item" :class="{'active': currentAgent && m.id === currentAgent.model_name}" @click="switchModel(m)" @mouseenter="modelSwitcherIdx = filteredSwitcherModels.indexOf(m)">
                                <div style="flex:1;min-width:0">
                                  <div style="display:flex;align-items:center;gap:6px">
                                    <span class="model-switcher-item-name" x-text="m.provider + ':' + (m.display_name || m.id)"></span>
                                    <span class="model-switcher-tier" :class="'tier-' + (m.tier || 'balanced').toLowerCase()" x-text="m.tier || 'Balanced'"></span>
                                  </div>
                                  <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
                                    <span class="text-xs text-dim" x-text="m.id" style="font-family:var(--font-mono)"></span>
                                    <span class="text-xs text-dim" x-show="m.context_window" x-text="m.context_window >= 1000000 ? (m.context_window/1000000).toFixed(1)+'M' : Math.round(m.context_window/1000)+'K'"></span>
                                    <svg x-show="m.supports_vision" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="opacity:0.5" title="Vision"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg x-show="m.supports_tools" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="opacity:0.5" title="Tools"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                                  </div>
                                </div>
                                <svg x-show="currentAgent && m.id === currentAgent.model_name" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </div>
                  <span class="text-xs text-dim" x-text="tokenCount > 0 ? '~' + tokenCount + ' tokens' : (attachments.length ? attachments.length + ' file(s)' : '')"></span>
                  <span class="queue-badge" x-show="messageQueue.length > 0" x-text="messageQueue.length + ' queued'"></span>
                </div>
                <div class="tip-bar" x-show="currentTip && !sending">
                  <span class="text-xs" x-text="currentTip"></span>
                  <button class="tip-bar-dismiss" @click="dismissTips()" title="Dismiss">&times;</button>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- MODE 2: Agent picker + Templates (no agent chatting) -->
        <div x-show="!activeChatAgent" class="chat-wrapper">
        <div class="page-header">
          <h2>Chat</h2>
          <div class="flex gap-2">
            <button class="button is-ghost is-small" x-show="agents.length" @click="openSpawnWizard()">+ New Agent</button>
            <button type="button" class="button is-danger is-light is-small" x-show="agents.length > 1" @click="killAllAgents()"><i class="fa fa-stop" aria-hidden="true"></i><span>Stop all</span></button>
          </div>
        </div>
        <div class="page-body" style="overflow-y:auto;padding:24px">

          <!-- Running agents — click to chat -->
          <div x-show="agents.length" style="margin-bottom:28px">
            <div class="text-sm font-bold mb-2" style="color:var(--text-dim);letter-spacing:0.5px;font-size:11px;text-transform:uppercase">Your Agents</div>
            <div style="display:flex;flex-wrap:wrap;gap:10px">
              <template x-for="agent in agents" :key="agent.id">
                <div class="agent-chip" @click="chatWithAgent(agent)" style="cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);transition:all 0.2s var(--ease-spring, ease);min-width:200px;box-shadow:var(--shadow-xs)" @mouseenter="$el.style.borderColor='var(--accent)';$el.style.transform='translateY(-2px)';$el.style.boxShadow='var(--shadow-md)'" @mouseleave="$el.style.borderColor='var(--border)';$el.style.transform='';$el.style.boxShadow='var(--shadow-xs)'">
                  <div style="width:36px;height:36px;border-radius:50%;background:var(--accent-subtle);display:flex;align-items:center;justify-content:center;flex-shrink:0">
                    <span x-show="agent.identity && agent.identity.emoji" x-text="agent.identity && agent.identity.emoji" style="font-size:18px"></span>
                    <svg x-show="!agent.identity || !agent.identity.emoji" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  </div>
                  <div style="min-width:0;flex:1">
                    <div class="font-bold" style="font-size:13px" x-text="agent.name"></div>
                    <div class="text-xs text-dim font-mono" style="font-size:11px" x-text="agent.model_name"></div>
                  </div>
                  <span class="badge" :class="'badge-' + agent.state.toLowerCase()" x-text="agent.state" style="font-size:10px"></span>
                  <button type="button" class="agent-chip-config-btn" @click.stop="showDetail(agent)" title="Agent settings" style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-dim);transition:all 0.15s;flex-shrink:0" @mouseenter="$el.style.borderColor='var(--accent)';$el.style.color='var(--accent)';$el.style.background='var(--surface2)'" @mouseleave="$el.style.borderColor='var(--border)';$el.style.color='var(--text-dim)';$el.style.background='transparent'" aria-label="Agent settings">
                    <i class="fa fa-cog" aria-hidden="true"></i>
                  </button>
                </div>
              </template>
            </div>
          </div>

          <!-- Quick-start templates — spawn + chat in one click -->
          <div>
            <div class="text-sm font-bold mb-2" style="color:var(--text-dim);letter-spacing:0.5px;font-size:11px;text-transform:uppercase" x-text="agents.length ? 'Or Start a New Agent' : 'Start Chatting'"></div>
            <div class="of-card-grid">
              <template x-for="t in builtinTemplates" :key="t.name">
                <div class="of-card" style="cursor:pointer" @click="t.manifest_toml ? spawnFromTemplate(t) : spawnBuiltin(t)">
                  <div class="flex justify-between items-center mb-1">
                    <div class="of-card-header" style="margin:0;font-size:14px;font-weight:600" x-text="t.name"></div>
                    <span class="badge badge-dim" x-text="t.category"></span>
                  </div>
                  <div class="text-sm" style="line-height:1.5;color:var(--text-dim)" x-text="t.description"></div>
                </div>
              </template>
            </div>
          </div>

          <!-- Custom spawn modal still available -->
          </div>

          <!-- Agent detail modal with tabs (Info / Files / Config) -->
          <template x-if="showDetailModal && detailAgent">
            <div class="of-modal-overlay" @click.self="showDetailModal = false" @keydown.escape.window="showDetailModal = false">
              <div class="of-modal">
                <div class="of-modal-header">
                  <h3>
                    <span x-show="detailAgent.identity && detailAgent.identity.emoji" x-text="detailAgent.identity && detailAgent.identity.emoji" style="margin-right:6px"></span>
                    <span x-text="detailAgent.name"></span>
                  </h3>
                  <div class="of-modal-header__actions">
                    <button type="button" class="button is-ghost is-small" @click="showDetailModal = false">Cancel</button>
                    <button type="button" class="of-modal-close" @click="showDetailModal = false" aria-label="Close">&times;</button>
                  </div>
                </div>
                <div class="of-tabs" style="margin-bottom:16px">
                  <div class="of-tab" :class="{ active: detailTab === 'info' }" @click="detailTab = 'info'">Info</div>
                  <div class="of-tab" :class="{ active: detailTab === 'files' }" @click="detailTab = 'files'; loadAgentFiles()">Files</div>
                  <div class="of-tab" :class="{ active: detailTab === 'config' }" @click="detailTab = 'config'; loadToolFilters()">Config</div>
                </div>

                <!-- Tab: Info -->
                <div x-show="detailTab === 'info'">
                  <div class="detail-grid">
                    <div class="detail-row"><span class="detail-label">ID</span><span class="detail-value text-xs" x-text="detailAgent.id" style="word-break:break-all"></span></div>
                    <div class="detail-row"><span class="detail-label">State</span><span class="badge" :class="'badge-' + detailAgent.state.toLowerCase()" x-text="detailAgent.state"></span></div>
                    <div class="detail-row"><span class="detail-label">Mode</span>
                      <select class="form-select" style="width:140px" :value="detailAgent.mode || 'full'" @change="setMode(detailAgent, $event.target.value)">
                        <option value="observe">Observe</option><option value="assist">Assist</option><option value="full">Full</option>
                      </select>
                    </div>
                    <div class="detail-row" x-show="detailAgent.profile"><span class="detail-label">Profile</span><span class="detail-value" style="text-transform:capitalize" x-text="detailAgent.profile || '-'"></span></div>
                    <div class="detail-row"><span class="detail-label">Provider</span>
                      <template x-if="!editingProvider">
                        <span>
                          <span class="detail-value" x-text="detailAgent.model_provider"></span>
                          <button class="button is-ghost is-small" style="margin-left:8px;padding:2px 8px;font-size:11px" @click="editingProvider = true; newProviderValue = detailAgent.model_provider">Change</button>
                        </span>
                      </template>
                      <template x-if="editingProvider">
                        <span class="flex gap-1" style="align-items:center">
                          <input class="form-input" style="width:160px;font-size:12px" x-model="newProviderValue" placeholder="provider" @keydown.enter="changeProvider()" @keydown.escape="editingProvider = false">
                          <button class="button is-primary is-small" @click="changeProvider()" :disabled="modelSaving" style="padding:2px 10px">
                            <span x-show="!modelSaving">Save</span><span x-show="modelSaving">...</span>
                          </button>
                          <button class="button is-ghost is-small" @click="editingProvider = false" style="padding:2px 8px">Cancel</button>
                        </span>
                      </template>
                    </div>
                    <div class="detail-row"><span class="detail-label">Model</span>
                      <template x-if="!editingModel">
                        <span>
                          <span class="detail-value" x-text="detailAgent.model_name"></span>
                          <button class="button is-ghost is-small" style="margin-left:8px;padding:2px 8px;font-size:11px" @click="editingModel = true; newModelValue = detailAgent.model_provider + '/' + detailAgent.model_name">Change</button>
                        </span>
                      </template>
                      <template x-if="editingModel">
                        <span class="flex gap-1" style="align-items:center">
                          <input class="form-input" style="width:240px;font-size:12px" x-model="newModelValue" placeholder="provider/model" @keydown.enter="changeModel()" @keydown.escape="editingModel = false">
                          <button class="button is-primary is-small" @click="changeModel()" :disabled="modelSaving" style="padding:2px 10px">
                            <span x-show="!modelSaving">Save</span><span x-show="modelSaving">...</span>
                          </button>
                          <button class="button is-ghost is-small" @click="editingModel = false" style="padding:2px 8px">Cancel</button>
                        </span>
                      </template>
                    </div>
                    <div class="detail-row"><span class="detail-label">Created</span><span class="detail-value" x-text="detailAgent.created_at ? new Date(detailAgent.created_at).toLocaleString() : '-'"></span></div>

                    <!-- Fallback Model Chain -->
                    <div class="detail-row" style="align-items:flex-start">
                      <span class="detail-label">Fallbacks</span>
                      <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;margin-left:16px">
                        <template x-if="detailAgent._fallbacks && detailAgent._fallbacks.length > 0">
                          <div style="display:flex;flex-direction:column;gap:4px">
                            <template x-for="(fb, idx) in detailAgent._fallbacks" :key="idx">
                              <div class="flex gap-1 items-center" style="min-width:0">
                                <span class="badge" style="font-size:11px;font-family:var(--font-mono);word-break:break-all;white-space:normal" x-text="(idx+1) + '. ' + fb.provider + '/' + fb.model"></span>
                                <button class="button is-ghost is-small" style="padding:1px 4px;font-size:10px;color:var(--danger);flex-shrink:0" @click="removeFallback(idx)">&times;</button>
                              </div>
                            </template>
                          </div>
                        </template>
                        <template x-if="!detailAgent._fallbacks || detailAgent._fallbacks.length === 0">
                          <span class="text-dim" style="font-size:12px">None — add a fallback chain</span>
                        </template>
                        <template x-if="!editingFallback">
                          <div>
                            <button class="button is-ghost is-small" style="padding:2px 8px;font-size:11px" @click="editingFallback = true; newFallbackValue = ''">+ Add</button>
                          </div>
                        </template>
                        <template x-if="editingFallback">
                          <div class="flex gap-1" style="align-items:center">
                            <input class="form-input" style="width:220px;font-size:12px" x-model="newFallbackValue" placeholder="provider/model" @keydown.enter="addFallback()" @keydown.escape="editingFallback = false">
                            <button class="button is-primary is-small" @click="addFallback()" style="padding:2px 10px;font-size:11px">Add</button>
                            <button class="button is-ghost is-small" @click="editingFallback = false" style="padding:2px 8px;font-size:11px">Cancel</button>
                          </div>
                        </template>
                      </div>
                    </div>
                  </div>
                  <div class="of-action-row mt-4">
                    <button type="button" class="button is-primary is-small" @click="chatWithAgent(detailAgent); showDetailModal = false"><i class="fa fa-comments" aria-hidden="true"></i><span>Chat</span></button>
                    <button type="button" class="button is-ghost is-small" @click="cloneAgent(detailAgent)"><i class="fa fa-copy" aria-hidden="true"></i><span>Clone</span></button>
                    <button type="button" class="button is-ghost is-small" @click="clearHistory(detailAgent)"><i class="fa fa-eraser" aria-hidden="true"></i><span>Clear history</span></button>
                    <button type="button" class="button is-danger is-light is-small" @click="killAgent(detailAgent)"><i class="fa fa-stop" aria-hidden="true"></i><span>Stop</span></button>
                  </div>
                </div>

                <!-- Tab: Files -->
                <div x-show="detailTab === 'files'">
                  <div x-show="filesLoading" class="text-center text-dim" style="padding:24px">Loading files...</div>
                  <div x-show="!filesLoading && !editingFile">
                    <template x-for="file in agentFiles" :key="file.name">
                      <div class="file-list-item" @click="openFile(file)">
                        <span class="font-mono" style="font-size:13px" x-text="file.name"></span>
                        <span class="text-xs text-dim" x-text="file.exists ? (file.size_bytes + ' bytes') : 'Not created'"></span>
                      </div>
                    </template>
                    <div x-show="!agentFiles.length && !filesLoading" class="text-center text-dim" style="padding:24px">No workspace files found</div>
                  </div>
                  <div x-show="editingFile">
                    <div class="flex justify-between items-center mb-2">
                      <span class="font-bold font-mono" x-text="editingFile"></span>
                      <button class="button is-ghost is-small" @click="closeFileEditor()">&larr; Back</button>
                    </div>
                    <textarea class="file-editor" x-model="fileContent" style="width:100%;height:280px;resize:vertical"></textarea>
                    <div class="flex gap-2 mt-2">
                      <button class="button is-primary is-small" @click="saveFile()" :disabled="fileSaving"><span x-show="!fileSaving">Save</span><span x-show="fileSaving">Saving...</span></button>
                      <button class="button is-ghost is-small" @click="closeFileEditor()">Cancel</button>
                    </div>
                  </div>
                </div>

                <!-- Tab: Config (inline editable) -->
                <div x-show="detailTab === 'config'">
                  <div class="form-group"><label>Name</label><input class="form-input" x-model="configForm.name"></div>
                  <div class="form-group"><label>System Prompt</label><textarea class="form-textarea" x-model="configForm.system_prompt" style="height:80px"></textarea></div>
                  <div class="form-group"><label>Emoji</label>
                    <div class="emoji-grid">
                      <template x-for="em in emojiOptions" :key="em">
                        <button class="emoji-grid-item" :class="{ active: configForm.emoji === em }" @click="configForm.emoji = em" x-text="em"></button>
                      </template>
                    </div>
                  </div>
                  <div class="form-group"><label>Color</label><input type="color" x-model="configForm.color" style="width:48px;height:32px;border:none;cursor:pointer;background:none"></div>
                  <div class="form-group"><label>Archetype</label>
                    <select class="form-select" x-model="configForm.archetype">
                      <option value="">None</option>
                      <template x-for="a in archetypeOptions" :key="a"><option :value="a.toLowerCase()" x-text="a"></option></template>
                    </select>
                  </div>
                  <div class="form-group"><label>Vibe</label>
                    <select class="form-select" x-model="configForm.vibe">
                      <option value="">None</option>
                      <option value="professional">Professional</option><option value="friendly">Friendly</option>
                      <option value="technical">Technical</option><option value="creative">Creative</option>
                      <option value="concise">Concise</option><option value="mentor">Mentor</option>
                    </select>
                  </div>
                  <button class="button is-primary mt-4" @click="saveConfig()" :disabled="configSaving">
                    <span x-show="!configSaving">Save Config</span><span x-show="configSaving">Saving...</span>
                  </button>

                  <!-- Tool Filters -->
                  <div class="mt-4" style="border-top:1px solid var(--border);padding-top:16px">
                    <h4 style="margin-bottom:8px;font-size:13px">Tool Filters</h4>
                    <p class="text-xs text-dim" style="margin-bottom:12px">Allowlist: only these tools available (empty = all). Blocklist: these tools excluded.</p>
                    <div class="form-group">
                      <label style="font-size:12px">Allowlist <span class="text-dim" x-text="'(' + toolFilters.tool_allowlist.length + ')'"></span></label>
                      <div class="flex flex-wrap gap-1 mb-1">
                        <template x-for="(t, i) in toolFilters.tool_allowlist" :key="'al-'+i">
                          <span class="badge" style="cursor:pointer" @click="removeAllowTool(t)" :title="'Click to remove ' + t"><span x-text="t"></span> &times;</span>
                        </template>
                      </div>
                      <div class="flex gap-1">
                        <input class="form-input" style="font-size:12px;flex:1" x-model="newAllowTool" placeholder="tool name" @keydown.enter="addAllowTool()">
                        <button class="button is-ghost is-small" @click="addAllowTool()">Add</button>
                      </div>
                    </div>
                    <div class="form-group">
                      <label style="font-size:12px">Blocklist <span class="text-dim" x-text="'(' + toolFilters.tool_blocklist.length + ')'"></span></label>
                      <div class="flex flex-wrap gap-1 mb-1">
                        <template x-for="(t, i) in toolFilters.tool_blocklist" :key="'bl-'+i">
                          <span class="badge badge-danger" style="cursor:pointer" @click="removeBlockTool(t)" :title="'Click to remove ' + t"><span x-text="t"></span> &times;</span>
                        </template>
                      </div>
                      <div class="flex gap-1">
                        <input class="form-input" style="font-size:12px;flex:1" x-model="newBlockTool" placeholder="tool name" @keydown.enter="addBlockTool()">
                        <button class="button is-ghost is-small" @click="addBlockTool()">Add</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <!-- Multi-step Spawn Wizard -->
          <template x-if="showSpawnModal">
            <div class="of-modal-overlay" @click.self="showSpawnModal = false" @keydown.escape.window="showSpawnModal = false">
              <div class="of-modal">
                <div class="of-modal-header">
                  <h3>Create Agent</h3>
                  <div class="of-modal-header__actions">
                    <button type="button" class="button is-ghost is-small" @click="showSpawnModal = false" :disabled="spawning">Cancel</button>
                    <button type="button" class="of-modal-close" @click="showSpawnModal = false" :disabled="spawning" aria-label="Close">&times;</button>
                  </div>
                </div>

                <!-- Wizard / TOML toggle -->
                <div class="of-tabs" style="margin-bottom:12px">
                  <div class="of-tab" :class="{ active: spawnMode === 'wizard' }" @click="spawnMode = 'wizard'">Wizard</div>
                  <div class="of-tab" :class="{ active: spawnMode === 'toml' }" @click="spawnMode = 'toml'">Raw TOML</div>
                </div>

                <!-- Raw TOML mode (unchanged) -->
                <div x-show="spawnMode === 'toml'">
                  <div class="form-group">
                    <label>Agent Manifest (TOML)</label>
                    <textarea class="form-textarea" style="height:200px;font-size:11px" x-model="spawnToml" placeholder='name = "my-agent"&#10;module = "builtin:chat"&#10;[model]&#10;provider = "groq"&#10;model = "llama-3.3-70b-versatile"&#10;system_prompt = "You are helpful."'></textarea>
                  </div>
                  <button class="button is-primary is-fullwidth mt-4" @click="spawnAgent()" :disabled="spawning">
                    <span x-show="!spawning">Spawn Agent</span><span x-show="spawning">Spawning...</span>
                  </button>
                </div>

                <!-- Wizard steps -->
                <div x-show="spawnMode === 'wizard'">
                  <!-- Step indicator -->
                  <div class="wizard-steps">
                    <template x-for="s in [1,2,3,4,5]" :key="s">
                      <div class="wizard-dot" :class="{ active: spawnStep === s, done: spawnStep > s }">
                        <span x-text="spawnStep > s ? '\u2713' : s"></span>
                      </div>
                    </template>
                  </div>

                  <!-- Step 1: Name + Identity -->
                  <div x-show="spawnStep === 1">
                    <div class="form-group">
                      <label>Agent Name</label>
                      <input class="form-input" x-model="spawnForm.name" placeholder="my-agent" @keydown.enter="if(!$event.isComposing && $event.keyCode !== 229) nextStep()">
                    </div>
                    <div class="form-group">
                      <label>Emoji</label>
                      <div class="emoji-grid">
                        <template x-for="em in emojiOptions" :key="em">
                          <button class="emoji-grid-item" :class="{ active: spawnIdentity.emoji === em }" @click="spawnIdentity.emoji = em" x-text="em"></button>
                        </template>
                      </div>
                    </div>
                    <div class="form-group">
                      <label>Color</label>
                      <input type="color" x-model="spawnIdentity.color" style="width:48px;height:32px;border:none;cursor:pointer;background:none">
                    </div>
                    <div class="form-group">
                      <label>Archetype</label>
                      <select class="form-select" x-model="spawnIdentity.archetype">
                        <option value="">Choose...</option>
                        <template x-for="a in archetypeOptions" :key="a"><option :value="a.toLowerCase()" x-text="a"></option></template>
                      </select>
                    </div>
                  </div>

                  <!-- Step 2: Model Selection -->
                  <div x-show="spawnStep === 2">
                    <div class="form-group">
                      <label>Provider</label>
                      <select class="form-select" x-model="spawnForm.provider">
                        <template x-if="spawnProvidersLoading">
                          <option disabled>Loading providers…</option>
                        </template>
                        <template x-if="!spawnProvidersLoading && spawnProviders.length === 0">
                          <option disabled>No providers available</option>
                        </template>
                        <template x-if="!spawnProvidersLoading && spawnProviders.filter(p => !p.is_local).length > 0">
                          <optgroup label="Cloud">
                            <template x-for="p in spawnProviders.filter(p => !p.is_local)" :key="p.id">
                              <option :value="p.id" x-text="p.display_name"></option>
                            </template>
                          </optgroup>
                        </template>
                        <template x-if="!spawnProvidersLoading && spawnProviders.filter(p => p.is_local).length > 0">
                          <optgroup label="Local">
                            <template x-for="p in spawnProviders.filter(p => p.is_local)" :key="p.id">
                              <option :value="p.id" x-text="p.display_name"></option>
                            </template>
                          </optgroup>
                        </template>
                      </select>
                    </div>
                    <div class="form-group">
                      <label>Model</label>
                      <input class="form-input" x-model="spawnForm.model" placeholder="e.g. llama-3.3-70b-versatile">
                    </div>
                    <div class="form-group">
                      <label>System Prompt</label>
                      <textarea class="form-textarea" x-model="spawnForm.systemPrompt" placeholder="You are a helpful assistant."></textarea>
                    </div>
                  </div>

                  <!-- Step 3: Personality Presets -->
                  <div x-show="spawnStep === 3">
                    <label class="mb-2" style="display:block;font-size:13px;font-weight:600">Personality</label>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">
                      <template x-for="preset in personalityPresets" :key="preset.id">
                        <button class="personality-pill" :class="{ active: selectedPreset === preset.id }" @click="selectPreset(preset)" x-text="preset.label"></button>
                      </template>
                    </div>
                    <div class="form-group">
                      <label>Soul / Persona <span class="text-xs text-dim">(editable)</span></label>
                      <textarea class="form-textarea" x-model="soulContent" style="height:100px" placeholder="Describe this agent's personality and communication style..."></textarea>
                    </div>
                  </div>

                  <!-- Step 4: Tools & Capabilities -->
                  <div x-show="spawnStep === 4">
                    <div class="form-group">
